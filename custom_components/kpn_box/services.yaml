ping:
  fields:
    host:
      required: true
      example: "8.8.8.8"
      selector:
        text:
    ip_version:
      selector:
        select:
          options: ["IPv4", "IPv6"]
    config_entry_id:
      selector:
        config_entry:
          integration: "kpn_box"

set_wifi_network:
  fields:
    network:
      required: true
      selector:
        select:
          options: ["main", "guest", "extra_2g", "extra_5g"]
    ssid:
      required: true
      selector:
        text:
    password:
      required: true
      selector:
        text:
          type: "password"
    security:
      selector:
        select:
          options: ["WPA2-Personal", "WPA3-Personal", "WPA2-WPA3-Personal"]
    pmf:
      selector:
        select:
          options: ["Disabled", "Optional", "Required"]
    config_entry_id:
      selector:
        config_entry:
          integration: "kpn_box"

set_wifi_schedule:
  fields:
    off_periods:
      required: true
      example: "[{\"days\": [\"mon\", \"tue\", \"wed\", \"thu\", \"fri\"], \"start\": \"22:00\", \"end\": \"07:00\"}]"
      selector:
        object:
    config_entry_id:
      selector:
        config_entry:
          integration: "kpn_box"

clear_wifi_schedule:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: "kpn_box"

set_mac_filter:
  fields:
    enabled:
      required: true
      selector:
        boolean:
    allowed_macs:
      example: "[\"AA:BB:CC:DD:EE:FF\"]"
      selector:
        object:
    config_entry_id:
      selector:
        config_entry:
          integration: "kpn_box"

set_device_schedule:
  fields:
    mac:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
