      required: true
      example: "[{\"days\": [\"mon\", \"tue\", \"wed\", \"thu\", \"fri\"], \"start\": \"22:00\", \"end\": \"07:00\"}]"
      selector:
        object:
    config_entry_id:
      selector:
        config_entry:
          integration: "kpn_box"

clear_device_schedule:
  fields:
    mac:
